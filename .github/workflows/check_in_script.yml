name: Check In for Push/PR

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: ${{ matrix.os }} with Python ${{ matrix.python-version }} / ${{ matrix.build-type }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.x' ]
        os: [ ubuntu-latest, macos-latest ]
        build-type: [ None, Debug, RelWithDebInfo ]

    steps:
    - uses: actions/checkout@v4

    - name: Setup python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        architecture: x64

    - name: Install Python dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip install numpy nanobind

    - name: CMake
      run: |
        if [ "${{ matrix.build-type }}" = "None" ]; then
          cmake -S ${{ github.workspace }} -B ${{ github.workspace }}/build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
            -DCMAKE_CXX_FLAGS="-Ofast -funroll-loops -march=native" \
            -DCompadre_USE_PYTHON:BOOL=ON \
            -DCompadre_USE_MPI:BOOL=OFF
        else
          cmake -S ${{ github.workspace }} -B ${{ github.workspace }}/build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
            -DCompadre_USE_PYTHON:BOOL=ON \
            -DCompadre_USE_MPI:BOOL=OFF
        fi

    - name: Build
      run: |
        cmake --build ${{ github.workspace }}/build --config ${{ matrix.build-type }}

    - name: Test
      working-directory: ${{ github.workspace }}/build
      run: |
        ctest --output-on-failure -C ${{ matrix.build-type }}

    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: test-failure-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.build-type }}.log
        path: ${{ github.workspace }}/build/Testing/Temporary/LastTest.log
